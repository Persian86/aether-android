name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            unzip \
            openjdk-17-jdk

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Accept Android SDK licenses (pre-emptive)
        run: |
          # Create the SDK directory structure if needed and accept licenses
          mkdir -p $HOME/.buildozer/android/platform
          # Buildozer will download SDK, but we can pre-accept common licenses
          echo "y" | yes | true  # placeholder; real acceptance happens via buildozer.spec

      - name: Build APK with Buildozer
        run: |
          # Ensure the accept_sdk_license is set (already in the provided spec)
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          retention-days: 7
